name: Build IPA (iOS SDK 27)

on:
  push:
    branches: [main, master, "feature/universal-plist-liquid-glass-ios27"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: iOS 27 unsigned IPA
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1 (iOS 27 SDK)
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.1.app ]; then sudo xcode-select -s /Applications/Xcode_27.1.app
          elif [ -d /Applications/Xcode_27.app ]; then sudo xcode-select -s /Applications/Xcode_27.app
          else echo "Xcode 27 unavailable" >&2; exit 1; fi
          xcodebuild -version
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          test "$SDK_MAJOR" = "27"
          echo "iphoneos SDK=$(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Verify lossless Universal Plist transformations
        run: |
          set -euo pipefail
          swiftc -swift-version 5 ABProps/UniversalPlistCodec.swift tests/UniversalCodecSmoke.swift -o /tmp/universal-codec-smoke
          /tmp/universal-codec-smoke

      - name: Validate recursive JSON, Base64 and binary plist editor
        run: |
          set -euo pipefail
          swiftc -swift-version 5 ABProps/UniversalPlistCodec.swift ABProps/ReadablePlistEngine.swift tests/ReadablePlistSmoke.swift -o /tmp/readable-plist-smoke
          /tmp/readable-plist-smoke

      - name: Build Capstone ARM64 static lib (iphoneos SDK 27)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          git clone --depth 1 https://github.com/capstone-engine/capstone.git Vendor/capstone
          cmake -S Vendor/capstone -B Vendor/capstone-build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=27.0 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCAPSTONE_BUILD_SHARED=OFF \
            -DCAPSTONE_BUILD_CSTOOL=OFF \
            -DCAPSTONE_BUILD_TESTS=OFF \
            -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF \
            -DCAPSTONE_ARM64_SUPPORT=ON \
            -DCAPSTONE_AARCH64_SUPPORT=ON
          cmake --build Vendor/capstone-build --config Release -- \
            -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS="-Wno-error -Wno-shorten-64-to-32"
          LIB=$(find Vendor/capstone-build -name 'libcapstone.a' | head -n 1)
          echo "LIB=$LIB"
          test -f "$LIB"
          cp "$LIB" Vendor/capstone-build/libcapstone.a
          ls -lh Vendor/capstone-build/libcapstone.a
          lipo -info Vendor/capstone-build/libcapstone.a

      - name: Build for device (unsigned)
        run: |
          mkdir -p build
          xcodebuild \
            -project ABProps.xcodeproj \
            -scheme ABProps \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            IPHONEOS_DEPLOYMENT_TARGET=27.0 \
            build

      - name: Pack IPA
        run: |
          APP=$(find build/DerivedData/Build/Products -name 'ABProps.app' | head -n 1)
          echo "APP=$APP"
          test -d "$APP"
          rm -rf Payload ABProps.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ABProps.ipa Payload
          ls -lh ABProps.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ABProps-iOS27-unsigned.ipa
          path: ABProps.ipa
          if-no-files-found: error
          retention-days: 14
