name: Build IPA (iOS SDK 26)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: SDK 26 unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode_26.app ]; then sudo xcode-select -s /Applications/Xcode_26.app
          elif [ -d /Applications/Xcode.app ]; then sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          echo "iphoneos SDK=$(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Build Capstone ARM64 static lib (iphoneos)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          git clone --depth 1 https://github.com/capstone-engine/capstone.git Vendor/capstone
          cmake -S Vendor/capstone -B Vendor/capstone-build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCAPSTONE_BUILD_SHARED=OFF \
            -DCAPSTONE_BUILD_CSTOOL=OFF \
            -DCAPSTONE_BUILD_TESTS=OFF \
            -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF \
            -DCAPSTONE_ARM64_SUPPORT=ON \
            -DCAPSTONE_AARCH64_SUPPORT=ON
          cmake --build Vendor/capstone-build --config Release -- \
            -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS="-Wno-error -Wno-shorten-64-to-32"
          LIB=$(find Vendor/capstone-build -name 'libcapstone.a' | head -n 1)
          echo "LIB=$LIB"
          test -f "$LIB"
          cp "$LIB" Vendor/capstone-build/libcapstone.a
          ls -lh Vendor/capstone-build/libcapstone.a
          lipo -info Vendor/capstone-build/libcapstone.a

      - name: Build for device (unsigned)
        run: |
          mkdir -p build
          xcodebuild \
            -project ABProps.xcodeproj \
            -scheme ABProps \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 \
            build

      - name: Pack IPA
        run: |
          APP=$(find build/DerivedData/Build/Products -name 'ABProps.app' | head -n 1)
          echo "APP=$APP"
          test -d "$APP"
          rm -rf Payload ABProps.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ABProps.ipa Payload
          ls -lh ABProps.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ABProps.ipa
          path: ABProps.ipa
          if-no-files-found: error
